name: Daily countdown post (backup, manual only)

# The daily 6:00 a.m. ET post now runs from GitLab (see ci/gitlab-ci.yml),
# because GitHub Actions is disabled on this account. This workflow has no
# schedule, so it can never double-post if GitHub turns Actions back on.
# It stays as a manual backup: Actions > this workflow > Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = render only, post = post for real"
        type: choice
        options: [preview, post]
        default: preview
      only:
        description: "Limit to one platform (blank = every platform with credentials)"
        type: choice
        options: ["", bluesky, x]
        default: ""
      force:
        description: "Post even if today's post already went out"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: countdown
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and post
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$MODE" != "post" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python bot/countdown.py $ARGS

      - name: Keep today's graphic as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countdown-graphic
          path: out/today.png
          retention-days: 7
