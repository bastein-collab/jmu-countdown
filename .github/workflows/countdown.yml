name: Daily countdown post

on:
  schedule:
    # 9:07 a.m. Eastern = 14:07 UTC. The countdown ends Feb. 25, before daylight saving
    # starts, so Eastern stays UTC-5 for the whole run. Set off the top of the hour
    # because GitHub delays :00 jobs the most.
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = render only, post = post for real"
        type: choice
        options: [preview, post]
        default: preview
      only:
        description: "Limit to one platform (blank = every platform with credentials)"
        type: choice
        options: ["", bluesky, x]
        default: ""
      force:
        description: "Post even if today's post already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: countdown
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and post
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$MODE" != "post" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python bot/countdown.py $ARGS

      - name: Keep today's graphic as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countdown-graphic
          path: docs/latest.png
          retention-days: 7

      # Saves which posts went out (so a re-run never double-posts) and today's
      # graphic (the live page's link preview). The daily commit also keeps the
      # repo active, which stops GitHub from pausing the schedule after 60 quiet days.
      - name: Save state and today's graphic
        if: always()
        run: |
          git config user.name "countdown-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/latest.png 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "Countdown $(TZ=America/New_York date +%F)"
          git push
